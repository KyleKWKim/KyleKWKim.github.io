name: Build CV PDF

# Re-renders assets/CV.pdf from cv.html whenever cv.html changes.
on:
  push:
    branches: [main]
    paths:
      - cv.html
      - scripts/build_cv_pdf.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Render PDF
        run: python scripts/build_cv_pdf.py

      - name: Commit PDF
        run: |
          if git diff --quiet -- assets/CV.pdf; then
            echo "CV.pdf unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/CV.pdf
          git commit -m "Rebuild CV.pdf from cv.html"
          git push
